# BO3MacFix options (one per line, KEY=VALUE). Delete or comment out (#) to turn off.
# Steam on the Mac ignores "env ... %command%" launch options: use this file.

# Ranked spoofing (T7Patch SPOOF_RANKED): set from Black Ops Mac (off unless you
# turn it on there). It changes your real Steam stats and can get the account banned.
#BO3MACFIX_SPOOF_RANKED=1

# BOIII/Ezz community servers: opens the game's socket to the internet and adds
# the console command boiii_connect ip:port (join from the Zombies menu).
BO3MACFIX_BOIII=1

# Other options:
# BO3MACFIX_AUDIO_SAMPLES=1024   (minimum audio block; 512 = lower latency, 2048 = steadier)
# BO3MACFIX_DISABLE_AUDIO_FIX=1
# BO3MACFIX_FRIENDSONLY=1
# BO3MACFIX_PLAYERNAME=YourName
# BO3MACFIX_NETWORKPASSWORD=password
# BO3MACFIX_DISABLE_STEAM_FILTERS=1
# BO3MACFIX_DISABLE_OPTIONAL_HOOKS=1
# BO3MACFIX_DEBUG_XP=1           (log the first AddRankXP calls to t7-status.log)
# BO3MACFIX_BOIII_SERVERID=0x10  (fix a BOIII server's serverId; normally found automatically)
# BO3MACFIX_BOIII_BROWSER=name   (server list when entering Zombies, filtered by name)
